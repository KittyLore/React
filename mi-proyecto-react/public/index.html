    <noscript>"Cógela Suave" es un proyecto innovador que busca ofrecer unas capsulas dependiendo

      sentimientos de los estudiantes que describan ellos mismos.
      A largo plazo, se espera que el proyecto pueda ponerse a prueba con un grupo de 
      estudiantes que acceda voluntariamente a "Cógela Suave" y se les ofrecerá una versión beta del 
      aplicativo. Es importante destacar que este proyecto no busca reemplazar el tratamiento 
      psicológico, sino ser un apoyo que brinda herramientas para manejar mejor las emociones.</noscript>
